name: Bug report
description: Something NiFiMCP did that it should not, or did not do that it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use synthetic data only. Never paste real flows, credentials, hostnames or customer data.
  - type: input
    id: version
    attributes:
      label: NiFiMCP version
      description: Output of `nifimcp --version`
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [demo, bundle, live]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and architecture, Python version, NiFi version, MCP host and version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands or tool calls, with a minimal synthetic bundle if possible
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: Include the result envelope's status, error code and gap codes. Remove anything sensitive.
    validations:
      required: true
