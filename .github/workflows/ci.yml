name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Offline tests and build (Linux, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Offline unit, security, protocol and evaluation tests
        run: uv run --frozen pytest -q
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Demo runs from the built wheel
        run: |
          uvx --from dist/nifimcp-*.whl nifimcp demo --output "$RUNNER_TEMP/demo"
          test -s "$RUNNER_TEMP/demo/report.html"
